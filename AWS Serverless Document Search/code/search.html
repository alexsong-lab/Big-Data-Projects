<!DOCTYPE html>
<html>
<head>
    <title>Document Search</title>
    <style>
        body {
            font-family: sans-serif;
            max-width: 480px;
            margin: 80px auto;
            padding: 0 16px;
            color: #333;
        }
        h1 { margin-bottom: 24px; }
        label { display: block; margin-bottom: 6px; font-weight: bold; }
        input[type="text"] {
            width: 100%;
            padding: 8px 10px;
            font-size: 1rem;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            margin-bottom: 12px;
        }
        input[type="submit"] {
            padding: 8px 20px;
            font-size: 1rem;
            background: #2563eb;
            color: #fff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        input[type="submit"]:hover { background: #1d4ed8; }
    </style>
</head>
<body>
    <h1>Document Search</h1>
    <form action="https://eshr3mkvmjp2w6eawgyredw5si0ienjv.lambda-url.us-west-2.on.aws/" method="GET">
        <label for="q">Search Query:</label>
        <input type="text" id="q" name="q" placeholder="Enter one or more keywords">
        <input type="submit" value="Search">
    </form>
</body>
</html>
